name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fredtools/**"
      - "requirements/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

# the token of the deploy job is allowed to publish the pages, nothing else
permissions:
  contents: read
  pages: write
  id-token: write

# a deployment must never be cancelled in the middle, so a new run waits
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # only the folders needed to build the documentation, which skips
          # the large test data in unittests/testData
          sparse-checkout: |
            docs
            fredtools
            requirements

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/requirement_*.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirement_docs.txt

      - name: Build the documentation
        env:
          MPLBACKEND: Agg
        # the doctrees are written outside the html folder, so that they are not published
        run: sphinx-build -b html -d "${RUNNER_TEMP}/doctrees" docs/source docs/html

      - name: Check that the documentation was built
        run: |
          set -euo pipefail
          test -f docs/html/index.html
          test -d docs/html/_static
          # the file is created by the sphinx.ext.githubpages extension and tells
          # GitHub not to hide the folders starting with an underscore
          test -f docs/html/.nojekyll
          echo "built $(find docs/html -type f | wc -l) files, $(du -sh docs/html | cut -f1)"

      - name: Upload the documentation as a pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
