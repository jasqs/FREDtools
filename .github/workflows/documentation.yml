name: Build and deploy documentation

# For main, the documentation is built and deployed by publish.yml (workflow_call), after the tests pass.
on:
  workflow_dispatch:
  workflow_call:

# the token of the deploy job is allowed to publish the pages, nothing else
permissions:
  contents: read
  pages: write
  id-token: write

# a deployment must never be cancelled in the middle, so a new run waits
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # only the folders needed to build the documentation (and the root files, e.g. pyproject.toml),
          # which skips the large test data in unittests/testData
          sparse-checkout: |
            docs
            fredtools

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # FREDtools itself is installed too, because docs/source/conf.py imports fredtools
      # for the version number and autodoc imports every module
      - name: Install FREDtools with the packages needed by the documentation
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group docs

      - name: Build the documentation
        env:
          MPLBACKEND: Agg
        # the doctrees are written outside the html folder, so that they are not published
        run: sphinx-build -b html -d "${RUNNER_TEMP}/doctrees" docs/source docs/html

      - name: Check that the documentation was built
        run: |
          set -euo pipefail
          test -f docs/html/index.html
          test -d docs/html/_static
          # the file is created by the sphinx.ext.githubpages extension and tells
          # GitHub not to hide the folders starting with an underscore
          test -f docs/html/.nojekyll
          echo "built $(find docs/html -type f | wc -l) files, $(du -sh docs/html | cut -f1)"

      - name: Upload the documentation as a pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
