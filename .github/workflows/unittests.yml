name: unittests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch cancels a run that is still going on
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # do not cancel the other versions when one of them fails
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: python ${{ matrix.python-version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # the test data in unittests/testData is large, so only the last commit is fetched
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # both files, because requirement_unittest.txt includes requirement_lib.txt
          cache-dependency-path: requirements/requirement_*.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirement_unittest.txt

      - name: Show the versions of the installed packages
        run: pip list

      - name: Run the unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s unittests -t . -v
