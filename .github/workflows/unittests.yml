name: unittests

# For main, the tests are run by publish.yml (workflow_call), before the documentation and the PyPI release.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# a new push to the same branch cancels a run that is still going on; github.workflow is the name of
# the calling workflow when called, so a called run and a run of this workflow never share a group
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # do not cancel the other versions when one of them fails
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    name: python ${{ matrix.python-version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # the test data in unittests/testData is large, so only the last commit is fetched
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FREDtools with the packages needed by the tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group unittests

      - name: Show the versions of the installed packages
        run: pip list

      - name: Run the unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s unittests -t . -v

  other-os:
    # Windows and macOS (Apple Silicon): the gamma index tests (with the libFredGI library of the
    # platform) are run first, then all the unit tests; both must pass.
    # macos-latest is always an Apple Silicon image; a pinned label such as macos-14 stops
    # working when GitHub retires that image (the jobs are then cancelled, not failed)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    name: ${{ matrix.os }}, python ${{ matrix.python-version }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FREDtools with the packages needed by the tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group unittests

      - name: Show the versions of the installed packages
        run: pip list

      - name: Run the gamma index tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s unittests/GammaIndex -t . -v

      - name: Run all unit tests
        timeout-minutes: 40
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s unittests -t . -v
