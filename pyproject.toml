[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fredtools"
dynamic = ["version"]  # read from fredtools/_version.py, see [tool.hatch.version]
description = "A collection of python functions for radiotherapy (RT) data and Monte Carlo results manipulation and analysis"
readme = "README.md"
license = "GPL-3.0-only AND LicenseRef-libFredGI"
license-files = ["LICENSE", "fredtools/GammaIndex/LICENSE-libFredGI.md"]
requires-python = ">=3.11"
authors = [{ name = "FRED Collaboration" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "SimpleITK>=2.2",
    "itk",
    "pydicom",
    "lmfit",
    "shapely>=2",
    "pydantic>=2",
    "dotted_dict",
    "pymupdf",
    "PyYAML",
    "ipython",
    "ipywidgets",
]

[project.optional-dependencies]
mc = [
    "uproot",
    "opengate",
    "landaupy",
    "pyamtrack",
    "scikit-image",
]
cuda12 = [
    "cupy-cuda12x",
]
cuda13 = [
    "cupy-cuda13x",
]

[project.urls]
Homepage = "https://github.com/jasqs/FREDtools"
Documentation = "https://jasqs.github.io/FREDtools/"
"FRED MC" = "https://www.fred-mc.org/"

[dependency-groups]
unittests = [
    "pydvh",
]
docs = [
    "sphinx>=4",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
]

# the version is the __version__ of fredtools/_version.py
[tool.hatch.version]
source = "code"
path = "fredtools/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fredtools"]

[tool.hatch.build.targets.sdist]
# only the package (pyproject.toml, README.md and the licence files are always added),
# not the 720 MB of test data
only-include = ["fredtools"]
